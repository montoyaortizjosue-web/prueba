<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>Seltos Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>/*{{LEAFLET_CSS}}*/</style>
<style>
  /* Tema claro (día) */
  .light {
    --bg: #e9ebee; --panel: #f4f5f7; --panel-2: #ffffff; --card: rgba(255,255,255,.92);
    --text: #15171a; --muted: #6b7280; --line: rgba(0,0,0,.08); --shadow: 0 6px 24px rgba(0,0,0,.10);
    --dock: #ffffff; --floor: radial-gradient(closest-side, rgba(0,0,0,.28), transparent);
  }
  /* Tema oscuro (noche) */
  .dark {
    --bg: #000000; --panel: #0d0f13; --panel-2: #171a20; --card: rgba(22,25,31,.92);
    --text: #f2f4f7; --muted: #8b93a1; --line: rgba(255,255,255,.08); --shadow: 0 6px 24px rgba(0,0,0,.5);
    --dock: #0d0f13; --floor: radial-gradient(closest-side, rgba(120,140,170,.22), transparent);
  }
  :root { --accent: #3e6ae1; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none;
    font-family: "Inter", Roboto, "Segoe UI", system-ui, sans-serif; }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  /* Lienzo fijo 1280x720, escalado a la pantalla del radio */
  #stage { position: absolute; top: 50%; left: 50%; width: 1280px; height: 720px; overflow: hidden;
    background: var(--bg); color: var(--text); transition: background .4s, color .4s; }

  /* ===== Panel del auto (izquierda) ===== */
  .carpanel { position: absolute; left: 0; top: 0; width: 470px; bottom: 76px; background: var(--panel);
    transition: background .4s; padding: 22px 26px; }
  .cp-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 15px; }
  .cp-top b { color: var(--text); font-weight: 600; }
  .gps-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 6px; vertical-align: middle; }
  .gps-dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .speed { margin-top: 18px; display: flex; align-items: flex-end; gap: 12px; }
  .speed .num { font-size: 92px; font-weight: 300; line-height: .9; letter-spacing: -3px; min-width: 140px; }
  .speed .unit { color: var(--muted); font-size: 16px; padding-bottom: 8px; }
  .speed .unit b { display: block; color: var(--text); font-size: 20px; font-weight: 600; }
  .car { position: absolute; left: 20px; right: 20px; top: 205px; height: 275px; }
  .car .floor { position: absolute; left: 6%; right: 6%; bottom: -6px; height: 44px; background: var(--floor); }
  .car img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  .light .car img { filter: drop-shadow(0 10px 12px rgba(0,0,0,.18)); }
  .dark .car img { filter: drop-shadow(0 0 1px rgba(160,180,210,.35)) brightness(1.08); }
  .tiles { position: absolute; left: 22px; right: 22px; bottom: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--panel-2); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); text-align: left; color: var(--text); }
  .tile span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .tile b { display: block; font-size: 22px; font-weight: 600; margin-top: 4px; white-space: nowrap; }
  .tile b small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .fuelbar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .fuelbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* ===== Mapa (derecha) ===== */
  .mapwrap { position: absolute; left: 470px; top: 0; right: 0; bottom: 76px; overflow: hidden; }
  #map { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--panel-2); }
  .dark .leaflet-tile-pane { filter: brightness(.9); }
  .leaflet-container { font-family: inherit; }
  .leaflet-control-attribution { font-size: 9px !important; opacity: .7; }
  .me { width: 34px; height: 34px; }
  .me svg { width: 34px; height: 34px; transition: transform .4s; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .map-off { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--muted); font-size: 15px; text-align: center; z-index: 400; }
  .map-off.show { display: flex; }
  .map-off svg { width: 44px; height: 44px; }

  .search { position: absolute; left: 16px; top: 16px; width: 380px; z-index: 500; }
  .search form { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--card);
    border-radius: 14px; box-shadow: var(--shadow); }
  .search svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 17px; }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; margin-top: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
  .chip svg { width: 16px; height: 16px; color: var(--muted); }

  .status { position: absolute; right: 16px; top: 16px; z-index: 500; display: flex; align-items: center; gap: 14px;
    height: 44px; padding: 0 16px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); font-size: 16px; font-weight: 500; }
  .status .wx { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .status svg { width: 18px; height: 18px; }

  .mapbtns { position: absolute; right: 16px; top: 76px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .mapbtn { width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .mapbtn svg { width: 22px; height: 22px; }
  .mapbtn.on { color: var(--accent); }

  /* Tarjeta multimedia flotante */
  .media { position: absolute; left: 16px; bottom: 16px; width: 420px; z-index: 500; background: var(--card);
    border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px 12px; }
  .media .row1 { display: flex; align-items: center; gap: 14px; }
  .cover { width: 56px; height: 56px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), #8aa8ff); color: #fff; }
  .cover svg { width: 26px; height: 26px; }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { border: 0; background: var(--line); color: var(--text); border-radius: 8px; height: 30px; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .seek { position: relative; height: 18px; margin-top: 10px; cursor: pointer; }
  .seek .track { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px; background: var(--line); }
  .seek i { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 4px; background: var(--text); width: 0; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }
  .ctrls { display: flex; justify-content: center; align-items: center; gap: 34px; margin-top: 4px; }
  .ctrls button { border: 0; background: none; color: var(--text); display: flex; }
  .ctrls svg { width: 28px; height: 28px; }
  .ctrls .pp svg { width: 36px; height: 36px; }

  /* ===== Dock inferior ===== */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--dock); border-top: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 18px; gap: 6px; transition: background .4s; }
  .dk { width: 72px; height: 60px; border: 0; border-radius: 12px; background: none; color: var(--text); text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 500; }
  .dk:active { background: var(--line); }
  .dk svg { width: 28px; height: 28px; }
  .dk .ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .dk .ic svg { width: 22px; height: 22px; }
  .dk-sep { width: 1px; height: 36px; background: var(--line); margin: 0 8px; }
  .grow { flex: 1; }
  .vol { display: flex; align-items: center; gap: 4px; }
  .vol button { width: 48px; height: 52px; border: 0; background: none; color: var(--text); display: flex; align-items: center; justify-content: center; border-radius: 10px; }
  .vol button:active { background: var(--line); }
  .vol svg { width: 26px; height: 26px; }
  .vol .lvl { width: 34px; text-align: center; font-size: 16px; font-weight: 600; }
  .clock { font-size: 20px; font-weight: 600; min-width: 64px; text-align: right; }

  /* ===== Ajustes ===== */
  .sheet { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 2000; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
  .sheet.open { display: flex; }
  .panel { width: 760px; background: var(--panel); color: var(--text); border-radius: 20px; padding: 24px 28px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .fld input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 0 12px; font-size: 16px; outline: none; }
  .fld input:focus { border-color: var(--accent); }
  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }
  .seg button.sel { background: var(--accent); color: #fff; }
  .sw { display: flex; gap: 10px; }
  .sw button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; }
  .sw button.sel { border-color: var(--text); }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 15px; font-weight: 500; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toast { position: absolute; left: calc(235px + 50%); top: 140px; transform: translateX(-50%); z-index: 3000; background: #111; color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div id="stage" class="light">

  <!-- ===== Panel del auto ===== -->
  <section class="carpanel">
    <div class="cp-top">
      <div><span class="gps-dot" id="gpsDot"></span><span id="gpsTxt">Buscando GPS…</span></div>
      <div id="hello">Hola, <b id="nameTxt">Conductor</b></div>
    </div>
    <div class="speed">
      <div class="num" id="speed">0</div>
      <div class="unit"><b id="heading"></b>km/h</div>
    </div>
    <div class="car">
      <div class="floor"></div>
      <img id="carImg" alt="Kia Seltos" src="{{CAR_IMG}}">
    </div>
    <div class="tiles">
      <button class="tile" id="tripTile"><span>Viaje</span><b id="trip">0.0<small>km</small></b></button>
      <button class="tile" data-open="settings"><span>Odómetro</span><b id="odo">0<small>km</small></b></button>
      <button class="tile" data-open="settings"><span>Combustible</span><b id="fuel">75<small>%</small></b><div class="fuelbar"><i id="fuelBar" style="width:75%"></i></div></button>
    </div>
  </section>

  <!-- ===== Mapa ===== -->
  <section class="mapwrap">
    <div id="map"></div>
    <div class="map-off" id="mapOff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      Mapa sin conexión<br><small>Se cargará al tener internet</small>
    </div>

    <div class="search">
      <form id="searchForm" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="dest" type="search" placeholder="Navegar a…" enterkeyhint="go">
      </form>
      <div class="chips">
        <button class="chip" data-fav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Casa</button>
        <button class="chip" data-fav="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Trabajo</button>
        <button class="chip" data-q="gasolinera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 7h5v4H7z"/></svg>Gasolinera</button>
      </div>
    </div>

    <div class="status">
      <span class="wx"><span id="wxIco"></span><span id="wxTemp">--°</span></span>
      <span id="mapClock">--:--</span>
    </div>

    <div class="mapbtns">
      <button class="mapbtn on" id="follow" title="Centrar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 19-7-4-7 4z"/></svg></button>
      <button class="mapbtn" id="zin" title="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="mapbtn" id="zout" title="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/></svg></button>
    </div>

    <div class="media">
      <div class="row1">
        <div class="cover"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6.5" cy="18" r="2.8"/><circle cx="17.5" cy="16" r="2.8"/></svg></div>
        <div class="meta"><b id="mTitle">Sin reproducción</b><span id="mArtist">Toca USB para elegir canciones</span></div>
        <button class="src" id="pickBtn">USB</button>
      </div>
      <div class="seek" id="seek"><div class="track"></div><i id="mProg"></i></div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="ctrls">
        <button id="mPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
        <button id="mPlay" class="pp" aria-label="Reproducir"><svg viewBox="0 0 24 24" fill="currentColor" id="ppIco"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="mNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
    </div>
  </section>

  <!-- ===== Dock ===== -->
  <nav class="dock">
    <button class="dk" data-open="settings" title="Ajustes del auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 15l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 9l2 6v3a1 1 0 0 1-1 1h-1.5M3 15v3a1 1 0 0 0 1 1h1.5M3 15h18"/><circle cx="7" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>Auto</button>
    <div class="dk-sep"></div>
    <a class="dk" href="intent:#Intent;package=com.google.android.projection.gearhead;end"><span class="ic" style="background:#1a73e8"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 19-8-4-8 4z"/></svg></span>Android Auto</a>
    <a class="dk" href="https://waze.com/ul"><span class="ic" style="background:#33ccff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 15a8 8 0 1 1 14-5c0 4-3 7-7 7H8"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/><path d="M9.5 13c1.5 1 3.5 1 5 0"/></svg></span>Waze</a>
    <a class="dk" href="spotify:"><span class="ic" style="background:#1db954"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 9.5c3.5-1 7.5-.6 11 1.2M7 12.8c3-.8 6.3-.4 9 1M7.6 16c2.5-.6 5-.3 7.2.8"/></svg></span>Spotify</a>
    <a class="dk" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_MUSIC;end"><span class="ic" style="background:#f97316"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-5"/><circle cx="15" cy="14" r="2.5"/></svg></span>Radio</a>
    <a class="dk" href="intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end"><span class="ic" style="background:#3b82f6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></span>Teléfono</a>
    <button class="dk" id="dockUsb"><span class="ic" style="background:#8b5cf6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span>Música USB</button>
    <a class="dk" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end"><span class="ic" style="background:#64748b"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span>Apps</a>
    <div class="grow"></div>
    <div class="vol">
      <button id="vDown" aria-label="Bajar volumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg></button>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" id="vIco"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span class="lvl" id="vLvl">7</span>
      <button id="vUp" aria-label="Subir volumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="dk-sep"></div>
    <div class="clock" id="clock">--:--</div>
  </nav>

  <!-- ===== Ajustes ===== -->
  <div class="sheet" id="sheet">
    <div class="panel">
      <h2>Ajustes</h2>
      <div class="grid2">
        <label class="fld"><span>Tu nombre</span><input id="sName" maxlength="16"></label>
        <div class="fld"><span>Tema</span><div class="seg" id="sTheme"><button data-v="auto">Automático</button><button data-v="light">Claro</button><button data-v="dark">Oscuro</button></div></div>
        <label class="fld"><span>Odómetro (km)</span><input id="sOdo" inputmode="numeric"></label>
        <label class="fld"><span>Combustible (%)</span><input id="sFuel" inputmode="numeric"></label>
        <label class="fld"><span>Dirección de casa</span><input id="sHome" placeholder="Ej: La Joya, Daule"></label>
        <label class="fld"><span>Dirección del trabajo</span><input id="sWork" placeholder="Ej: Av. 9 de Octubre, Guayaquil"></label>
        <div class="fld"><span>Color de acento</span><div class="sw" id="sAccent"></div></div>
        <div class="fld"><span>Viaje</span><button class="btn" id="sResetTrip" style="width:100%">Reiniciar contador de viaje</button></div>
      </div>
      <div class="actions">
        <div class="grow"></div>
        <button class="btn" id="sCancel">Cancelar</button>
        <button class="btn main" id="sSave">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="files" accept="audio/*" multiple hidden>
  <audio id="audio" preload="metadata"></audio>
</div>

<script>/*{{LEAFLET_JS}}*/</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage");

  // ---------- Almacenamiento seguro ----------
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("seltos2." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("seltos2." + k, JSON.stringify(v)); } catch (e) {} }
  };
  var ACCENTS = ["#3e6ae1", "#e82127", "#16a34a", "#f59e0b", "#8b5cf6", "#0ea5e9"];
  var cfg = {
    name: store.get("name", "Conductor"), theme: store.get("theme", "auto"), accent: store.get("accent", 0),
    odo: store.get("odo", 12480), fuel: store.get("fuel", 75), home: store.get("home", ""), work: store.get("work", ""),
    trip: store.get("trip", 0), vol: store.get("vol", 7)
  };
  var FALLBACK = [-2.1709, -79.9224]; // Guayaquil

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2500);
  }

  // ---------- Escalado a la pantalla ----------
  // El lienzo se estira en ancho o alto para llenar pantallas 16:9, 1024x600, etc. sin franjas negras
  function fit() {
    var W = window.innerWidth, H = window.innerHeight, w = 1280, h = 720;
    if (W / H >= w / h) w = Math.min(1700, Math.round(h * W / H)); else h = Math.min(860, Math.round(w * H / W));
    var s = Math.min(W / w, H / h);
    stage.style.width = w + "px"; stage.style.height = h + "px";
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    if (map) map.invalidateSize();
  }
  window.addEventListener("resize", fit);

  // ---------- Tema día / noche ----------
  var isDay = null; // dato real de Open-Meteo cuando llega
  function currentTheme() {
    if (cfg.theme !== "auto") return cfg.theme;
    if (isDay !== null) return isDay ? "light" : "dark";
    var h = new Date().getHours(); return (h >= 6 && h < 18) ? "light" : "dark";
  }
  function applyTheme() {
    var t = currentTheme();
    if (!stage.classList.contains(t)) {
      stage.classList.remove("light", "dark"); stage.classList.add(t);
      setTiles(t);
    }
    document.documentElement.style.setProperty("--accent", ACCENTS[cfg.accent] || ACCENTS[0]);
  }

  // ---------- Datos del auto ----------
  function fmt(n, d) { return Number(n).toLocaleString("es", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function renderCar() {
    $("nameTxt").textContent = cfg.name;
    $("odo").innerHTML = fmt(cfg.odo) + "<small>km</small>";
    $("trip").innerHTML = fmt(cfg.trip, 1) + "<small>km</small>";
    var f = Math.max(0, Math.min(100, cfg.fuel));
    $("fuel").innerHTML = f + "<small>%</small>";
    $("fuelBar").style.width = f + "%";
    $("fuelBar").style.background = f <= 15 ? "#ef4444" : "";
  }

  // ---------- Reloj ----------
  function tick() {
    var hm = new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", hour12: false });
    $("clock").textContent = hm; $("mapClock").textContent = hm;
    applyTheme();
  }

  // ---------- Mapa (Leaflet + CARTO / OpenStreetMap) ----------
  var map = null, tiles = null, me = null, follow = true, tileErrors = 0, tileOk = false;
  var TILE = {
    light: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  };
  var start = store.get("lastPos", FALLBACK);
  function setTiles(theme) {
    if (!map) return;
    if (tiles) map.removeLayer(tiles);
    tiles = L.tileLayer(TILE[theme], { maxZoom: 19, subdomains: "abcd", detectRetina: true,
      attribution: "© OpenStreetMap © CARTO" });
    tiles.on("tileload", function () { tileOk = true; $("mapOff").classList.remove("show"); });
    tiles.on("tileerror", function () { tileErrors++; if (!tileOk && tileErrors > 3) $("mapOff").classList.add("show"); });
    tiles.addTo(map);
  }
  if (window.L) {
    map = L.map("map", { zoomControl: false, attributionControl: true, zoomSnap: 0.5 }).setView(start, 16);
    map.attributionControl.setPrefix(false);
    me = L.marker(start, { icon: L.divIcon({ className: "me", iconSize: [34, 34], iconAnchor: [17, 17],
      html: '<svg viewBox="0 0 34 34" id="meArrow"><circle cx="17" cy="17" r="15" fill="#fff"/><path d="M17 6l8 20-8-4.5L9 26z" fill="var(--accent)"/></svg>' }),
      interactive: false }).addTo(map);
    map.on("dragstart", function () { setFollow(false); });
    setTiles(currentTheme());
  } else {
    $("mapOff").classList.add("show");
  }
  function setFollow(on) { follow = on; $("follow").classList.toggle("on", on); if (on && lastFix && map) map.panTo(lastFix); }
  $("follow").onclick = function () { setFollow(true); };
  $("zin").onclick = function () { if (map) map.zoomIn(); };
  $("zout").onclick = function () { if (map) map.zoomOut(); };

  // ---------- GPS: velocidad, rumbo, viaje ----------
  var lastFix = null, lastTime = 0, lastSaved = 0, weatherAt = 0;
  var DIRS = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function bearing(a, b) {
    var r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
    var x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  function onFix(p) {
    var c = p.coords, pos = [c.latitude, c.longitude], now = p.timestamp || Date.now();
    $("gpsDot").classList.add("ok");
    $("gpsTxt").textContent = "GPS ±" + Math.round(c.accuracy) + " m";
    var kmh = (c.speed !== null && c.speed !== undefined && !isNaN(c.speed)) ? c.speed * 3.6 : null;
    var hdg = (c.heading !== null && c.heading !== undefined && !isNaN(c.heading)) ? c.heading : null;
    if (lastFix) {
      var d = haversine(lastFix, pos), dt = (now - lastTime) / 1000;
      if (kmh === null && dt > 0) kmh = (d / dt) * 3.6;
      if (hdg === null && d > 5) hdg = bearing(lastFix, pos);
      // Sumar distancia sólo con buena precisión y saltos realistas
      if (c.accuracy <= 40 && d >= 3 && d < 300) {
        cfg.trip += d / 1000; cfg.odo += d / 1000;
        if (now - lastSaved > 15000) { store.set("trip", cfg.trip); store.set("odo", cfg.odo); store.set("lastPos", pos); lastSaved = now; }
        renderCar();
      }
    }
    if (kmh !== null && kmh < 2) kmh = 0;
    $("speed").textContent = kmh === null ? "0" : Math.round(kmh);
    if (hdg !== null) {
      $("heading").textContent = DIRS[Math.round(hdg / 45) % 8];
      var a = document.getElementById("meArrow"); if (a) a.style.transform = "rotate(" + hdg + "deg)";
    }
    if (map) { me.setLatLng(pos); if (follow) map.panTo(pos, { animate: true, duration: .8 }); }
    if (!lastFix) store.set("lastPos", pos);
    lastFix = pos; lastTime = now;
    if (Date.now() - weatherAt > 15 * 60000) weather(pos[0], pos[1]);
  }
  function onGpsErr() {
    $("gpsDot").classList.remove("ok"); $("gpsTxt").textContent = "Sin GPS";
    if (!weatherAt) weather(start[0], start[1]);
  }
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(onFix, onGpsErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  } else onGpsErr();
  setTimeout(function () { if (!weatherAt) weather(start[0], start[1]); }, 8000);
  $("tripTile").onclick = function () { toast("Viaje medido con GPS. Reinícialo en Ajustes."); };

  // ---------- Clima real (Open-Meteo) ----------
  var WX = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15a5 5 0 1 1 1-9.9A6 6 0 0 1 19 7a4 4 0 0 1-1 8z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15a5 5 0 1 1 1-9.9A6 6 0 0 1 19 7a4 4 0 0 1-1 8"/><path d="M12 13l-2 4h4l-2 4"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16M3 13h18M5 17h14"/></svg>'
  };
  function wxIcon(code, day) {
    if (code <= 1) return day ? WX.sun : WX.moon;
    if (code <= 3) return WX.cloud;
    if (code <= 48) return WX.fog;
    if (code >= 95) return WX.storm;
    return WX.rain;
  }
  function weather(lat, lon) {
    weatherAt = Date.now();
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
      "&current=temperature_2m,weather_code,is_day&timezone=auto";
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current;
      isDay = c.is_day === 1;
      $("wxIco").innerHTML = wxIcon(c.weather_code, isDay);
      $("wxTemp").textContent = Math.round(c.temperature_2m) + "°C";
      applyTheme();
    }).catch(function () { $("wxTemp").textContent = "--°"; });
  }

  // ---------- Navegación (abre Waze) ----------
  function navigate(q) {
    if (!q) return;
    var url = "https://waze.com/ul?q=" + encodeURIComponent(q) + "&navigate=yes";
    if (lastFix) url += "&ll=" + lastFix[0] + "," + lastFix[1];
    window.location.href = url;
  }
  $("searchForm").onsubmit = function (e) { e.preventDefault(); navigate($("dest").value.trim()); $("dest").blur(); };
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) {
    b.onclick = function () {
      if (b.dataset.q) return navigate(b.dataset.q);
      var addr = cfg[b.dataset.fav];
      if (addr) navigate(addr); else { toast("Configura esta dirección en Ajustes"); openSettings(); }
    };
  });

  // ---------- Reproductor de música (USB / memoria) ----------
  var audio = $("audio"), list = [], idx = 0, url = null;
  var PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
  function mmss(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function parseName(f) {
    var n = f.name.replace(/\.[^.]+$/, "").replace(/_/g, " ");
    var parts = n.split(" - ");
    return parts.length > 1 ? { artist: parts[0].trim(), title: parts.slice(1).join(" - ").trim() } : { artist: "Música USB", title: n };
  }
  function load(i, autoplay) {
    if (!list.length) return;
    idx = (i + list.length) % list.length;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(list[idx]);
    audio.src = url;
    var m = parseName(list[idx]);
    $("mTitle").textContent = m.title; $("mArtist").textContent = m.artist + "  ·  " + (idx + 1) + "/" + list.length;
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: m.title, artist: m.artist, album: "Seltos" });
    }
    if (autoplay) audio.play().catch(function () {});
  }
  function pick() { $("files").click(); }
  $("files").onchange = function () {
    var fs = Array.prototype.slice.call(this.files).filter(function (f) { return /^audio\//.test(f.type) || /\.(mp3|m4a|aac|ogg|flac|wav)$/i.test(f.name); });
    if (!fs.length) return toast("No se encontraron canciones");
    fs.sort(function (a, b) { return a.name.localeCompare(b.name); });
    list = fs; load(0, true); toast(fs.length + " canciones cargadas");
  };
  $("pickBtn").onclick = pick; $("dockUsb").onclick = pick;
  $("mPlay").onclick = function () { if (!list.length) return pick(); if (audio.paused) audio.play().catch(function () {}); else audio.pause(); };
  $("mNext").onclick = function () { load(idx + 1, true); };
  $("mPrev").onclick = function () { if (audio.currentTime > 3) audio.currentTime = 0; else load(idx - 1, true); };
  audio.onended = function () { load(idx + 1, true); };
  audio.onplay = audio.onpause = function () { $("ppIco").innerHTML = '<path d="' + (audio.paused ? PLAY : PAUSE) + '"/>'; };
  audio.ontimeupdate = audio.onloadedmetadata = function () {
    var d = audio.duration || 0;
    $("mProg").style.width = d ? (audio.currentTime / d * 100) + "%" : "0";
    $("tCur").textContent = mmss(audio.currentTime); $("tDur").textContent = mmss(d);
  };
  $("seek").onclick = function (e) {
    if (!audio.duration) return;
    var r = this.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
  };
  if ("mediaSession" in navigator) {
    // Permite que los botones del volante / Bluetooth controlen la música (si el radio lo soporta)
    try {
      navigator.mediaSession.setActionHandler("play", function () { audio.play(); });
      navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
      navigator.mediaSession.setActionHandler("nexttrack", function () { load(idx + 1, true); });
      navigator.mediaSession.setActionHandler("previoustrack", function () { load(idx - 1, true); });
    } catch (e) {}
  }

  // ---------- Volumen ----------
  function setVol(v) {
    cfg.vol = Math.max(0, Math.min(10, v)); audio.volume = cfg.vol / 10;
    $("vLvl").textContent = cfg.vol; store.set("vol", cfg.vol);
  }
  $("vUp").onclick = function () { setVol(cfg.vol + 1); };
  $("vDown").onclick = function () { setVol(cfg.vol - 1); };

  // ---------- Ajustes ----------
  var draft = {};
  var sw = $("sAccent");
  ACCENTS.forEach(function (c, i) {
    var b = document.createElement("button"); b.style.background = c; b.dataset.i = i;
    b.onclick = function () { draft.accent = i; markSel(); }; sw.appendChild(b);
  });
  Array.prototype.forEach.call($("sTheme").children, function (b) { b.onclick = function () { draft.theme = b.dataset.v; markSel(); }; });
  function markSel() {
    Array.prototype.forEach.call(sw.children, function (b, i) { b.classList.toggle("sel", i === draft.accent); });
    Array.prototype.forEach.call($("sTheme").children, function (b) { b.classList.toggle("sel", b.dataset.v === draft.theme); });
  }
  function openSettings() {
    draft = { accent: cfg.accent, theme: cfg.theme, resetTrip: false };
    $("sName").value = cfg.name; $("sOdo").value = Math.round(cfg.odo); $("sFuel").value = cfg.fuel;
    $("sHome").value = cfg.home; $("sWork").value = cfg.work;
    markSel(); $("sheet").classList.add("open");
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-open=settings]"), function (b) { b.onclick = openSettings; });
  $("sCancel").onclick = function () { $("sheet").classList.remove("open"); };
  $("sheet").onclick = function (e) { if (e.target === this) this.classList.remove("open"); };
  $("sResetTrip").onclick = function () { draft.resetTrip = true; toast("El viaje se reiniciará al guardar"); };
  $("sSave").onclick = function () {
    cfg.name = $("sName").value.trim() || "Conductor";
    var o = parseInt($("sOdo").value.replace(/\D/g, ""), 10); if (!isNaN(o)) cfg.odo = o;
    var f = parseInt($("sFuel").value, 10); if (!isNaN(f)) cfg.fuel = Math.max(0, Math.min(100, f));
    cfg.home = $("sHome").value.trim(); cfg.work = $("sWork").value.trim();
    cfg.accent = draft.accent; cfg.theme = draft.theme;
    if (draft.resetTrip) cfg.trip = 0;
    ["name", "odo", "fuel", "home", "work", "accent", "theme", "trip"].forEach(function (k) { store.set(k, cfg[k]); });
    $("sheet").classList.remove("open");
    renderCar(); applyTheme(); toast("Ajustes guardados");
  };

  // ---------- Mantener pantalla encendida ----------
  function wake() { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) wake(); });
  wake();

  // ---------- Inicio ----------
  fit(); setVol(cfg.vol); renderCar(); tick(); setInterval(tick, 1000);
  window.addEventListener("beforeunload", function () { store.set("trip", cfg.trip); store.set("odo", cfg.odo); });
})();
</script>
</body>
</html>
